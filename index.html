<!doctype html>
<html lang="en">
  <head>
    <!-- =========================
         BASIC
    ========================== -->
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta name="theme-color" content="#09090b" />

    <!-- =========================
         SEO
    ========================== -->
    <title>Drona Fitness | Premium Fitness & Training</title>

    <meta
      name="description"
      content="Drona Fitness is a premium fitness club offering strength training, personal training, functional fitness, HIIT and expert coaching."
    />

    <meta
      name="keywords"
      content="Drona Fitness, gym, fitness, personal training, strength training, HIIT, functional fitness, trainers"
    />

    <meta name="author" content="Drona Fitness" />

    <!-- Tell search engines to index the website -->
    <meta name="robots" content="index, follow" />

    <!-- =========================
         FAVICON
    ========================== -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <link
      rel="apple-touch-icon"
      href="/favicon.svg"
    />

    <!-- =========================
         OPEN GRAPH / SOCIAL SHARING
    ========================== -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Drona Fitness | Premium Fitness & Training"
    />

    <meta
      property="og:description"
      content="Train with purpose. Build strength, improve performance and become your strongest self with Drona Fitness."
    />

    <meta
      property="og:image"
      content="/og-image.jpg"
    />

    <meta
      property="og:site_name"
      content="Drona Fitness"
    />

    <!-- Replace this with your real domain after deployment -->
    <meta
      property="og:url"
      content="https://yourdomain.com"
    />

    <!-- =========================
         TWITTER / X
    ========================== -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Drona Fitness | Premium Fitness & Training"
    />

    <meta
      name="twitter:description"
      content="Premium fitness training, expert coaches and programs designed around your goals."
    />

    <meta
      name="twitter:image"
      content="/og-image.jpg"
    />

    <!-- =========================
         PERFORMANCE
    ========================== -->
    <link
      rel="preconnect"
      href="https://images.unsplash.com"
    />

  </head>

  <body>
    <!-- React Application -->
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
